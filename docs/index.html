  <body class="sidebar-chevron-right">
    <!-- Loading dialog -->
    <div id="app">Please wait...</div>

    <script>
      window.$docsify = {
        // Set name and repository link
        name: "Artificial Intelligence Links",
        nameLink: {
          "/": "#/",
        },
        repo: "https://github.com/Easy-PhD/AILinks",
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md',
          '/.*/_navbar.md': '/_navbar.md',
        },

        // Load _coverpage.md
        coverpage: true,
        // onlyCover: true,

        // Load _navbar.md
        loadNavbar: true,
        hideNavbar: false,
        mergeNavbar: true,
        // topMargin: 90,

        // Load _sidebar.md
        loadSidebar: true,
        hideSidebar: false,

        // Set max level
        maxLevel: 2,
        subMaxLevel: 1,

        //
        auto2top: true,

        // The default value is false
        executeScript: true,

        // routerMode: 'history',

        plugins: [
          // === Load raw HTML files as page content ===
          function (hook, vm) {
            hook.beforeEach(function (content) {
              if (vm.route.file.endsWith(".html")) {
                return fetch(vm.route.file)
                  .then((res) => res.text())
                  .catch(() => "Failed to load HTML");
              }
              return content;
            });
          },

          // === Read timestamps from _updated.json and inject a banner ===
          function (hook, vm) {
            // Load the JSON only once (cache the promise across page navigations)
            let mapPromise = null;
            const loadMap = () => {
              if (!mapPromise) {
                mapPromise = fetch("_updated.json")
                  .then((r) => (r.ok ? r.json() : {}))
                  .catch(() => ({}));
              }
              return mapPromise;
            };

            hook.afterEach(function (html, next) {
              loadMap().then((map) => {
                // vm.route.file is the current markdown file, e.g. "README.md"
                const file = vm.route.file;
                const ts = map[file];

                // No timestamp for this file — render as-is
                if (!ts) return next(html);

                // Format the ISO timestamp as "HH:MM DD/MM/YYYY"
                const d = new Date(ts);
                const pad = (n) => String(n).padStart(2, "0");
                const formatted =
                  `${pad(d.getHours())}:${pad(d.getMinutes())} ` +
                  `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;

                // Build the "Last Modified" banner (right-aligned, gray, small)
                const banner =
                  `<div style="color:gray;font-size:14px;text-align:right">` +
                  `Last Modified: ${formatted}</div>`;

                // Prepend the banner to the rendered HTML (same effect as whereToPlace: "top")
                next(banner + html);
              });
            });
          },
        ],

        // Markdown

        // Search

        // LaTex
        latex: {
          inlineMath: [
            ["$", "$"],
            // ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            // ["\\[", "\\]"]
          ],
          customOptions: {},
        },

        // Alerts
        "flexible-alerts": {
          style: "flat", // callout
        },

        // Count
        count: {
          countable: true,
          fontsize: "0.9em",
          color: "rgb(90,90,90)",
          language: "english",
        },

        // Vue
        vueGlobalOptions: {
          methods: {
            diffDate(inputDate) {
              // day/month/year
              const inputDateParts = inputDate.split("-");
              const targetDate = new Date(
                inputDateParts[0],
                inputDateParts[1] - 1,
                inputDateParts[2],
              );

              const today = new Date();

              // targetDate.setHours(0, 0, 0, 0);
              // today.setHours(0, 0, 0, 0);

              const diffDate = today.getTime() - targetDate.getTime();
              const daysDiffDate = Math.floor(diffDate / (1000 * 60 * 60 * 24));

              // Expired: The deadline has passed.

              if (inputDate == "") {
                return "";
              } else {
                if (daysDiffDate < 0) {
                  return -daysDiffDate;
                } else {
                  return "Expired";
                }
              }
            },
          },
        },

        // Mermaid
        mermaidConfig: {
          querySelector: ".mermaid",
        },

      }
    </script>
